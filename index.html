<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Procedural HD-2D Voxel</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            border: 1px solid #333;
        }
        h1 { margin: 0 0 5px 0; font-size: 16px; color: #00ffcc; }
        p { margin: 3px 0; font-size: 12px; }
    </style>
    <!-- Carregando Three.js para os Gráficos 3D/Voxel -->
    <script src="https://cloudflare.com"></script>
    <!-- Carregando biblioteca de Ruído Perlin para o terreno procedural -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ui">
        <h1>Mundo Procedural HD-2D</h1>
        <p>Estilo: Voxel / Pixel Art</p>
        <p>Mouse: Rotacionar a câmera</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. CONFIGURAÇÕES DO MUNDO ---
        const LARGURA_MUNDO = 40;
        const PROFUNDIDADE_MUNDO = 40;
        const ALTURA_MAXIMA = 8;
        const TAMANHO_VOXEL = 1;

        // --- 2. SETUP DA CENA THREE.JS ---
        const container = document.getElementById('canvas-container');
        const cena = new THREE.Scene();
        cena.background = new THREE.Color(0x87CEEB); // Céu azul

        // Câmera com ângulo inclinado característico do HD-2D
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(LARGURA_MUNDO, ALTURA_MAXIMA * 2.5, PROFUNDIDADE_MUNDO * 1.5);
        camera.lookAt(LARGURA_MUNDO / 2, ALTURA_MAXIMA / 2, PROFUNDIDADE_MUNDO / 2);

        // Renderizador configurado para manter os pixels nítidos (Estilo HD-2D)
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // Antialias falso para visual pixelado
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 3. ILUMINAÇÃO ---
        const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.4);
        cena.add(luzAmbiente);

        const luzSol = new THREE.DirectionalLight(0xffffff, 0.8);
        luzSol.position.set(LARGURA_MUNDO, ALTURA_MAXIMA * 3, PROFUNDIDADE_MUNDO / 2);
        luzSol.castShadow = true;
        luzSol.shadow.mapSize.width = 2048;
        luzSol.shadow.mapSize.height = 2048;
        cena.add(luzSol);

        // --- 4. TEXTURAS PROCEDURAIS ESTILO PIXEL ART ---
        // Função auxiliar para criar texturas pixeladas sem precisar carregar imagens externas
        function criarTexturaPixelada(corBase, corDetalhe) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = corBase;
            ctx.fillRect(0, 0, 16, 16);
            // Adiciona ruído visual simulando pixels de jogos retrô
            for (let i = 0; i < 16; i++) {
                for (let j = 0; j < 16; j++) {
                    if (Math.random() > 0.7) {
                        ctx.fillStyle = corDetalhe;
                        ctx.fillRect(i, j, 1, 1);
                    }
                }
            }
            const textura = new THREE.CanvasTexture(canvas);
            textura.magFilter = THREE.NearestFilter; // ESSENCIAL PARA HD-2D: Mantém os pixels nítidos
            textura.minFilter = THREE.NearestFilter;
            return textura;
        }

        // Criando materiais dos blocos
        const matGrama = new THREE.MeshLambertMaterial({ map: criarTexturaPixelada('#4ca64c', '#3d853d') });
        const matTerra = new THREE.MeshLambertMaterial({ map: criarTexturaPixelada('#86592d', '#664422') });
        const matAgua  = new THREE.MeshLambertMaterial({ map: criarTexturaPixelada('#3399ff', '#1a75ff'), transparent: true, opacity: 0.8 });

        // --- 5. GERAÇÃO DO TERRENO PROCEDURAL (VOXELS) ---
        const simplex = new SimplexNoise();
        const geometriaCubo = new THREE.BoxGeometry(TAMANHO_VOXEL, TAMANHO_VOXEL, TAMANHO_VOXEL);

        for (let x = 0; x < LARGURA_MUNDO; x++) {
            for (let z = 0; z < PROFUNDIDADE_MUNDO; z++) {
                
                // Usando Ruído Perlin/Simplex para calcular a elevação suavemente
                // Ajustamos a frequência dividindo por 20 para criar colinas suaves
                let valorRuido = simplex.noise2D(x / 20, z / 20); 
                
                // Normaliza o ruído para uma escala de altura de blocos (0 até ALTURA_MAXIMA)
                let alturaCalculada = Math.floor((valorRuido + 1) * 0.5 * ALTURA_MAXIMA);

                // Garante um nível mínimo para o terreno
                if (alturaCalculada < 1) alturaCalculada = 1;

                // Preenche a coluna vertical de blocos
                for (let y = 0; y <= alturaCalculada; y++) {
                    let materialUsado;

                    if (y === alturaCalculada) {
                        materialUsado = matGrama; // Topo é grama
                    } else {
                        materialUsado = matTerra; // Meio e base é terra
                    }

                    const bloco = new THREE.Mesh(geometriaCubo, materialUsado);
                    bloco.position.set(x, y, z);
                    bloco.castShadow = true;
                    bloco.receiveShadow = true;
                    cena.add(bloco);
                }

                // Se a altura for baixa, adiciona blocos de água por cima até o nível estável (mar)
                const NIVEL_DO_MAR = 2;
                if (alturaCalculada < NIVEL_DO_MAR) {
                    for (let y = alturaCalculada + 1; y <= NIVEL_DO_MAR; y++) {
                        const blocoAgua = new THREE.Mesh(geometriaCubo, matAgua);
                        blocoAgua.position.set(x, y, z);
                        cena.add(blocoAgua);
                    }
                }
            }
        }

        // --- 6. ANIMAÇÃO / INTERAÇÃO ---
        let angulo = 0;
        function animar() {
            requestAnimationFrame(animar);

            // Faz a câmera orbitar suavemente o cenário para podermos ver o relevo 3D
            angulo += 0.002;
            const raio = LARGURA_MUNDO * 1.3;
            camera.position.x = LARGURA_MUNDO / 2 + Math.cos(angulo) * raio;
            camera.position.z = PROFUNDIDADE_MUNDO / 2 + Math.sin(angulo) * raio;
            camera.lookAt(LARGURA_MUNDO / 2, ALTURA_MAXIMA / 2, PROFUNDIDADE_MUNDO / 2);

            renderer.render(cena, camera);
        }

        // Responsividade do navegador
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Inicia a renderização
        animar();
    </script>
</body>
</html>
